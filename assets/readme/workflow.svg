<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="304" viewBox="0 0 1280 304" role="img" aria-labelledby="title desc">
  <title id="title">APK analysis workflow</title>
  <desc id="desc">Five stages: environment, information gathering, static analysis, dynamic analysis, and report. Missing capabilities remain documented and lead to a report.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#0c1424"/></linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c7697" stroke-width="1.2"/></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="302" rx="20" fill="url(#bg)" stroke="#26374f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="43" font-size="12" font-weight="700" letter-spacing="2.1" fill="#9db4d1">APK → EVIDENCE → REPORT</text>
    <text x="1248" y="42" text-anchor="end" font-size="12" fill="#778da9">Persist artifacts at every stage</text>
    <g fill="none" stroke="#5c7697" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M236 137H274"/><path d="M481 137H519"/><path d="M726 137H764"/><path d="M971 137H1009"/>
    </g>
    <g>
      <rect x="32" y="76" width="204" height="122" rx="12" fill="#14253a" stroke="#31566e"/>
      <rect x="277" y="76" width="204" height="122" rx="12" fill="#14253a" stroke="#31566e"/>
      <rect x="522" y="76" width="204" height="122" rx="12" fill="#17283f" stroke="#3e577c"/>
      <rect x="767" y="76" width="204" height="122" rx="12" fill="#20283f" stroke="#545a86"/>
      <rect x="1012" y="76" width="236" height="122" rx="12" fill="#1b2b37" stroke="#49736d"/>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#7fd6e7">
      <text x="49" y="103">S0</text><text x="294" y="103">S1</text><text x="539" y="103">S2</text><text x="784" y="103">S3</text><text x="1029" y="103">S4</text>
    </g>
    <g fill="#edf4ff" font-size="19" font-weight="600">
      <text x="49" y="134">Environment</text><text x="294" y="134">Gather</text><text x="539" y="134">Static analysis</text><text x="784" y="134">Dynamic analysis</text><text x="1029" y="134">Report</text>
    </g>
    <g fill="#93a9c4" font-size="12.5">
      <text x="49" y="160">Tools · paths · capabilities</text><text x="49" y="180">Record what is available</text>
      <text x="294" y="160">Unpack · metadata · strings</text><text x="294" y="180">Parallel producers + join</text>
      <text x="539" y="160">Entrypoints · JNI · candidates</text><text x="539" y="180">Link findings to sources</text>
      <text x="784" y="160">Selected test emulator</text><text x="784" y="180">Observe or record limits</text>
      <text x="1029" y="160">Evidence · next steps</text><text x="1029" y="180">Keep skipped items explicit</text>
    </g>
    <path d="M32 228H1248" stroke="#283b53" stroke-dasharray="3 6"/>
    <circle cx="39" cy="266" r="4" fill="#9cb0d6"/>
    <text x="53" y="270" font-size="13" fill="#9eb2cd">Missing tool or unavailable runtime → documented fallback → report with measured scope</text>
    <rect x="1030" y="249" width="218" height="31" rx="15" fill="#172a35" stroke="#3d625f"/>
    <text x="1139" y="269" text-anchor="middle" font-size="11" fill="#a6d6cb" font-weight="700" letter-spacing="1">NO PLACEHOLDER SUCCESS</text>
  </g>
</svg>
